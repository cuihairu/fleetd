[package]
name = "fleetd-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "fleetd core: ledger, config, dispatch, jobs, topology (no server IO face)"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
toml.workspace = true
rusqlite.workspace = true
dirs.workspace = true
schemars.workspace = true
async-trait.workspace = true
tokio.workspace = true

# libtmux itself refuses to build on non-unix targets (`compile_error!`), so
# the dependency rides the unix gate; the executor face that uses it is
# `#[cfg(unix)]` too.
[target.'cfg(unix)'.dependencies]
libtmux.workspace = true
