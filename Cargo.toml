[package]
name = "fleetd"
version = "0.1.0"
edition = "2021"
description = "Load-aware dispatcher for claude tasks across machines (local / imac / openclaw / dev)"
license = "MIT"

[[bin]]
name = "fleetd"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
chrono = { version = "0.4", features = ["clock"] }
rmcp = { version = "3.8", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["io-std", "io-util", "rt", "macros"] }
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi"] }
