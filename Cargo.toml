[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/store",
    "crates/probe",
    "crates/register",
    "crates/relay",
    "crates/scheduler",
    "crates/report",
    "crates/service",
    "crates/mcp",
    "crates/agent",
    "crates/tray",
    ".",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
schemars = "1"

[package]
name = "fleetd"
version.workspace = true
edition.workspace = true
description = "Load-aware dispatcher for claude tasks across machines (local / imac / openclaw / dev)"
license.workspace = true

[[bin]]
name = "fleetd"
path = "src/main.rs"

[dependencies]
fleetd-core = { path = "crates/core" }
store = { path = "crates/store" }
probe = { path = "crates/probe" }
register = { path = "crates/register" }
relay = { path = "crates/relay" }
scheduler = { path = "crates/scheduler" }
report = { path = "crates/report" }
service = { path = "crates/service" }
mcp = { path = "crates/mcp" }
agent = { path = "crates/agent" }
tray = { path = "crates/tray" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
chrono.workspace = true
rmcp = { version = "3.8", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["io-std", "io-util", "rt", "macros"] }
toml.workspace = true
rusqlite.workspace = true
dirs.workspace = true

[profile.release]
opt-level = 2
